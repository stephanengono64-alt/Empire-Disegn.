<style>

<canvas id="c"></canvas>

  </div>
</div>

<script>
// Particules de fond
(function(){
  var c=document.getElementById('c'),ctx=c.getContext('2d'),W,H,pts=[];
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); window.addEventListener('resize',resize);
  for(var i=0;i<60;i++) pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.3+.3,a:Math.random()*.4+.08});
  (function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(function(p,i){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(212,160,23,'+p.a+')'; ctx.fill();
      for(var j=i+1;j<pts.length;j++){
        var q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<100){ ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.strokeStyle='rgba(212,160,23,'+(0.08*(1-d/100))+')'; ctx.lineWidth=.5; ctx.stroke(); }
      }
    });
    requestAnimationFrame(draw);
  })();
})();

// Liens

}
</script>
