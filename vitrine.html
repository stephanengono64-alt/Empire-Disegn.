function el(tag,props,children){
  var e=document.createElement(tag);
  if(props) Object.keys(props).forEach(function(k){
    if(k==='style'&&typeof props[k]==='object') Object.assign(e.style,props[k]);
    else if(k==='html') e.innerHTML=props[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),props[k]);
    else e.setAttribute(k,props[k]);
  });
  if(children) [].concat(children).forEach(function(c){ if(c!=null) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}
function css(r){ var s=document.createElement('style'); s.textContent=r; document.head.appendChild(s); }

// CURSOR
var dot=el('div',{class:'dot'}), ring=el('div',{class:'ring'});
document.body.appendChild(dot); document.body.appendChild(ring);
var mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',function(e){ mx=e.clientX; my=e.clientY; dot.style.left=mx+'px'; dot.style.top=my+'px'; });
(function tick(){ rx+=(mx-rx)*.12; ry+=(my-ry)*.12; ring.style.left=rx+'px'; ring.style.top=ry+'px'; requestAnimationFrame(tick); })();
document.addEventListener('mouseover',function(e){
  var over=e.target.closest('button,a,.scard,.pcard');
  ring.style.transform='translate(-50%,-50%) scale('+(over?'1.6':'1')+')';
  ring.style.borderColor='rgba(212,160,23,'+(over?'.85':'.5')+')';
});

// CANVAS
(function(){
  var c=document.getElementById('bg'),ctx=c.getContext('2d'),W,H,pts=[];
  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize(); window.addEventListener('resize',resize);
  for(var i=0;i<80;i++) pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.4+.4,a:Math.random()*.45+.1});
  (function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(function(p,i){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(212,160,23,'+p.a+')'; ctx.fill();
      for(var j=i+1;j<pts.length;j++){
        var q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<110){ ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.strokeStyle='rgba(212,160,23,'+(0.1*(1-d/110))+')'; ctx.lineWidth=.5; ctx.stroke(); }
      }
    });
    requestAnimationFrame(draw);
  })();
})();

function inp(type,id,ph){
